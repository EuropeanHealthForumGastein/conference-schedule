name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Upload Artifact"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
          cache_dependency_path: ./src/ehfg-event-schedule/pnpm-lock.yaml
          package_json_file: ./src/ehfg-event-schedule/package.json

      - name: Install dependencies
        working-directory: ./src/ehfg-event-schedule
        run: pnpm install --frozen-lockfile

      - name: Update sessions data
        working-directory: ./src/ehfg-event-schedule
        run: |
          chmod +x update-sessions.sh
          ./update-sessions.sh

      - name: Test
        working-directory: ./src/ehfg-event-schedule
        run: pnpm test

      - name: Build (Next.js static export)
        working-directory: ./src/ehfg-event-schedule
        env:
          NEXT_PUBLIC_BASE_PATH: /ehfg-conference-schedule
        run: pnpm build

      - name: Add .nojekyll to allow directories starting with _
        working-directory: ./src/ehfg-event-schedule
        run: echo > out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/ehfg-event-schedule/out

  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
